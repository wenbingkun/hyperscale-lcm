{{- if .Values.satellite.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-satellite
  labels:
    {{- include "hyperscale-lcm.labels" . | nindent 4 }}
    app.kubernetes.io/component: satellite
spec:
  selector:
    matchLabels:
      {{- include "hyperscale-lcm.satellite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperscale-lcm.satellite.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "hyperscale-lcm.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "hyperscale-lcm.satellite.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.satellite.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.satellite.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: satellite
          image: {{ include "hyperscale-lcm.image" (dict "image" .Values.satellite.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.satellite.image.pullPolicy }}
          env:
            - name: LCM_CORE_ADDR
              value: {{ printf "%s:%v" (default (printf "%s-core" .Release.Name) .Values.satellite.core.host) .Values.satellite.core.grpcPort | quote }}
            {{- if .Values.security.mtls.enabled }}
            - name: LCM_CERTS_DIR
              value: {{ .Values.security.mtls.mountPath | quote }}
            {{- end }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LCM_MOCK_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.satellite.env }}
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.satellite.resources | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            {{- if .Values.security.mtls.enabled }}
            - name: mtls-certs
              mountPath: {{ .Values.security.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      hostNetwork: true
      hostPID: true
      volumes:
        {{- if .Values.security.mtls.enabled }}
        - name: mtls-certs
          secret:
            secretName: {{ .Values.security.mtls.secretName }}
        {{- end }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: host-proc
          hostPath:
            path: /proc
{{- end }}
