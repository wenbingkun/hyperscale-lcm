# ============================================
# Hyperscale LCM 生产环境配置
# ============================================
# 激活方式: -Dquarkus.profile=prod
# 或设置环境变量: QUARKUS_PROFILE=prod

# ============================================
# 安全配置
# ============================================
# 禁用 SQL 日志（避免敏感数据泄露）
quarkus.hibernate-orm.log.sql=false

# 生产环境 CORS 配置（必须设置实际域名）
quarkus.http.cors.origins=${ALLOWED_ORIGINS}

# 禁用开发工具
quarkus.swagger-ui.always-include=false
quarkus.dev-ui.enabled=false

# ============================================
# HTTP/SSL 配置
# ============================================
# gRPC 与 HTTP 共享同一 Vert.x 服务器 (use-separate-server=false)，quarkus.grpc.server.ssl.*
# 不生效。双端口：8080 明文承载 REST/health/metrics（集群内，前端与探针使用），
# 8443 为 HTTPS + 强制客户端证书，Satellite 的 gRPC 经此端口走 mTLS。
# client-auth 是构建期固定属性，不能仅靠运行时环境变量开启。
quarkus.http.insecure-requests=enabled
quarkus.http.ssl-port=8443
quarkus.http.ssl.certificate.files=${GRPC_CERT_PATH}
quarkus.http.ssl.certificate.key-files=${GRPC_KEY_PATH}
quarkus.http.ssl.certificate.trust-store-file=${GRPC_TRUSTSTORE_PATH}
quarkus.http.ssl.certificate.trust-store-password=${GRPC_TRUSTSTORE_PASSWORD}
quarkus.http.ssl.client-auth=required
# 明文 8080 上的 gRPC 请求在进入 handler 前被拒绝（见 GrpcTlsEnforcer）
lcm.grpc.require-tls=true

# ============================================
# 访问日志配置
# ============================================
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D

# ============================================
# 性能优化
# ============================================
# JDBC 连接池 (Flyway migrations)
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Reactive 连接池 (runtime queries)
quarkus.datasource.reactive.max-size=200

# Timefold 求解时间（生产环境可加长）
quarkus.timefold.solver.termination.spent-limit=60s

# ============================================
# 健康检查配置
# ============================================
# quarkus.smallrye-health.root-path is set in base application.properties
quarkus.health.extensions.enabled=true
