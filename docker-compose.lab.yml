# Single-host lab overlay for docker-compose.prod.yml: dev login, a fixed-address SSH target and a
# per-Satellite certificate. NOT for production. See documentation/runbooks/lab-quickstart.md.
#   scripts/lab_prepare.sh
#   docker compose -p lcm-lab -f docker-compose.prod.yml -f docker-compose.lab.yml up -d
#   scripts/lab_bootstrap.sh
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24

services:
  lcm-core:
    environment:
      - LCM_AUTH_DEV_USERS_ENABLED=true
      - QUARKUS_HTTP_AUTH_PERMISSION_PUBLIC_PATHS=/api/auth/*
      - QUARKUS_HTTP_AUTH_PERMISSION_PUBLIC_POLICY=permit
      - ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - LCM_SSH_DEFAULT_USER=ops
      - LCM_SSH_DEFAULT_KEY_REF=lab_ed25519

  lcm-satellite:
    networks:
      default:
        ipv4_address: 172.30.77.20
    volumes:
      - ./lab/data/satellite-certs:/app/certs:ro
      - ./lab/data/ssh/keys:/app/ssh/keys:ro
      - ./lab/data/ssh/known_hosts:/app/ssh/known_hosts:ro

  lab-sshd:
    build: ./lab/sshd
    image: local/lcm-lab-sshd:1
    container_name: lcm-lab-sshd
    networks:
      default:
        ipv4_address: 172.30.77.30
    volumes:
      - ./lab/data/sshd:/etc/ssh/lab:ro
    restart: unless-stopped
